<!DOCTYPE html>

<head><meta charset="utf-8"><title>Netlify Forms: hidden declarations</title>
<meta name="robots" content="noindex,nofollow"></head>
<body>
<!--
  This file does two jobs, both forced by @netlify/plugin-nextjs v5 (OpenNext).

  1. DETECTION. Pages are served by a Lambda function, so Netlify's crawler
     cannot scan rendered HTML for data-netlify attributes. These hidden stubs
     live in public/ (uploaded as a static file) so the build bot registers
     every form and field name. Netlify only stores fields it detected here -
     anything missing is dropped from the submission without an error.

  2. SUBMISSION. Every request to a rendered route - POSTs included - is
     handled by the Next.js function, which answers 200 with page HTML and
     never lets Netlify's form handler see the body. So the app posts here
     instead: a static file served from the CDN, where the form handler does
     run. See src/lib/netlifyForms.ts.

  Every form below repeats the marketing attribution block, because
  appendAttributionToFormData() in src/lib/attribution.ts appends those keys to
  every submission. Keep the two in step.
-->

<form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
  <input name="bot-field">
  <input name="name">
  <input name="email">
  <input name="company">
  <select name="topic"></select>
  <textarea name="message"></textarea>
  <!-- Lead metadata carried from service-page CTAs (?service=&cta=&source=). -->
  <input name="source_page"><input name="service_interest"><input name="cta_name">
  <input name="utm_source"><input name="utm_medium"><input name="utm_campaign">
  <input name="utm_term"><input name="utm_content"><input name="utm_id">
  <input name="gclid"><input name="gbraid"><input name="wbraid"><input name="fbclid">
  <input name="msclkid"><input name="li_fat_id"><input name="ttclid">
  <input name="first_landing_page"><input name="first_referrer">
  <input name="captured_at"><input name="expires_at">
</form>
